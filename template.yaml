AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  LINE Webhook ID Collector - collects userId / groupId / roomId from LINE webhook events
  for multiple bots into a single DynamoDB table.

Parameters:
  TableName:
    Type: String
    Default: line-webhook-targets
  SecretNamePrefix:
    Type: String
    Default: line-webhook-id-collector/
    Description: Secrets Manager name prefix; each bot's secret is "<prefix><bot_id>".
    MinLength: 2
    AllowedPattern: ^[A-Za-z0-9/_+=.@-]{1,400}/$
    ConstraintDescription: >-
      必須是 1 到 400 個合法的 Secrets Manager 名稱字元（英數字與 /_+=.@-），
      且必須以斜線 "/" 結尾；空字串或缺少結尾斜線會讓 IAM policy 的資源 ARN
      放寬為 "secret:*"，因此不允許。
  SecretCacheTtlSeconds:
    Type: Number
    Default: 300
  NameLookupLimit:
    Type: Number
    Default: 50
  NameLookupBudgetSeconds:
    Type: Number
    Default: 8
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
  LogTargetIds:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  LogRetentionDays:
    Type: Number
    Default: 30
  ApiStageName:
    Type: String
    Default: v1
    AllowedPattern: ^[a-zA-Z0-9_-]{1,64}$
    Description: REST API stage 名稱，會成為 webhook URL 的第一段 path。
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: >-
      Lambda CPU 架構。arm64 較便宜，但 build 主機需能產生 arm64 native wheel
      （Docker + QEMU arm64）；沒有時改用 x86_64。

Globals:
  Function:
    Runtime: python3.14
    # 有 native 相依套件（pydantic-core、aiohttp、multidict、yarl、frozenlist 等）。
    # 務必用 `sam build --use-container`（或 samconfig 的 use_container = true）打包，
    # 且容器架構要與 Architecture 參數一致，避免 wheel 架構不符導致 Lambda 冷啟動失敗。
    Architectures: [!Ref Architecture]
    MemorySize: 256
    Timeout: 15

Resources:
  TargetsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bot_id
          AttributeType: S
        - AttributeName: target_id
          AttributeType: S
      KeySchema:
        - AttributeName: bot_id
          KeyType: HASH
        - AttributeName: target_id
          KeyType: RANGE

  # 使用 REST API（API Gateway v1）而非 HTTP API：部分新區域（例如 ap-east-2 台北）
  # 尚未提供 HTTP API。REST API 的 Lambda proxy 事件同樣帶有 pathParameters、headers、
  # body、isBase64Encoded，handler 不需修改。
  WebhookApi:
    Type: AWS::Serverless::Api
    Properties:
      Description: LINE webhook receiver
      StageName: !Ref ApiStageName
      EndpointConfiguration:
        Type: REGIONAL

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: line_webhook_id_collector.handler.lambda_handler
      Description: Verify LINE signature, collect IDs, answer developer commands.
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref TargetsTable
          SECRET_NAME_PREFIX: !Ref SecretNamePrefix
          SECRET_CACHE_TTL_SECONDS: !Ref SecretCacheTtlSeconds
          NAME_LOOKUP_LIMIT: !Ref NameLookupLimit
          NAME_LOOKUP_BUDGET_SECONDS: !Ref NameLookupBudgetSeconds
          LOG_LEVEL: !Ref LogLevel
          LOG_TARGET_IDS: !Ref LogTargetIds
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:GetItem
              Resource: !GetAtt TargetsTable.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretNamePrefix}*"
      Events:
        Webhook:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /webhook/{bot_id}
            Method: POST
      LoggingConfig:
        LogGroup: !Ref WebhookLogGroup

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-webhook"
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  WebhookBaseUrl:
    Description: Append /webhook/<bot_id> for each bot.
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}"
  TableName:
    Value: !Ref TargetsTable
  SecretNamePrefix:
    Value: !Ref SecretNamePrefix
