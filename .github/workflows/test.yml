name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Check src/requirements.txt is in sync with uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project --frozen -o src/requirements.txt
          git diff --exit-code src/requirements.txt
      - name: Test
        run: uv run pytest -q
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - name: Validate SAM template
        run: sam validate --lint --region ap-northeast-1
