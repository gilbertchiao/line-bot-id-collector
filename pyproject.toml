[project]
name = "line-webhook-id-collector"
version = "1.0.0"
description = "Serverless LINE webhook that collects userId / groupId / roomId into DynamoDB."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.35",
    "line-bot-sdk>=3.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "moto[dynamodb,secretsmanager]>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/line_webhook_id_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
# ruff 0.16+ 預設會掃描 *.md 檔案並格式化其中的 Python code block，
# 但 docs/ 底下是規劃文件（PRD、SDD 計畫），不屬於可執行原始碼，排除以避免誤判。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
